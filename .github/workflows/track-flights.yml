name: track flight prices

on:
  schedule:
    - cron: "0 12,3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      ORIGIN_AIRPORTS: IAD,RIC
      DESTINATION_AIRPORTS: TOS,KEF,ABZ,HEL,ALF,BOO,EVE,KKN,LYR,KTT,RVN,IVL,KRN,LLA,SFJ,GOH,YXY,YZF,FAI
      DATE_RANGE_START: "2027-01-25"
      DATE_RANGE_END: "2027-02-05"
      MIN_TRIP_LENGTH: "3"
      MAX_TRIP_LENGTH: "11"
      CURRENCY: USD
      SERPAPI_COUNTRY: us
      SERPAPI_LANGUAGE: en
      MIN_ALERT_PRICE: "500"
      PRICE_DROP_ALERT: "50"
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID_1: ${{ secrets.DISCORD_CHANNEL_ID_1 }}
      DISCORD_CHANNEL_ID_2: ${{ secrets.DISCORD_CHANNEL_ID_2 }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: run unit tests
        run: python -m unittest discover -s tests
      - name: track prices and update discord
        run: python -m src.flight_tracker.main
      - name: commit price history and message id
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/price-history.png data/discord_message_id.txt
          if ! git diff --cached --quiet; then
            git commit -m "update flight price history"
            git push
          fi
